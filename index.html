<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e6eef6">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>🧪</text></svg>">
<title>AgroChem Command · ศูนย์ควบคุมโรงงานเคมีเกษตร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --text:#0f1b2d; --muted:#6b7a90; --line:#e4e9f0; --panel:rgba(255,255,255,.94);
  --blue:#2563eb; --blue-soft:#e8f0ff; --green:#16a34a; --green-soft:#e7f7ec;
  --amber:#d97706; --amber-soft:#fff4e0; --red:#dc2626; --red-soft:#fdecec; --teal:#0d9488;
  --shadow:0 8px 30px rgba(15,35,70,.10),0 1px 3px rgba(15,35,70,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:"IBM Plex Sans Thai",system-ui,"Segoe UI",Tahoma,sans-serif;color:var(--text);background:#e6eef6}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#scene{position:fixed;inset:0}
#scene canvas{display:block}
.labels{position:absolute;inset:0;pointer-events:none}
.ui{position:fixed;inset:0;pointer-events:none}
.ui>*{pointer-events:auto}
.card{background:var(--panel);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.7);border-radius:14px;box-shadow:var(--shadow)}

header{position:absolute;left:12px;right:12px;top:12px;height:56px;display:flex;align-items:center;gap:14px;padding:0 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:210px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#16a34a);display:grid;place-items:center;color:#fff}
.brand b{display:block;font-size:15px;line-height:1.1}
.brand small{color:var(--muted);font-size:11.5px}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:#f3f6fa;border:1px solid var(--line);border-radius:10px;padding:0 12px;height:36px;color:var(--muted)}
.search input{border:0;background:transparent;outline:0;flex:1;font:inherit;font-size:13px;color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px;white-space:nowrap}
.chip small{color:var(--muted)}
.live{color:var(--green);font-weight:600}
.live i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(22,163,74,.5);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
.spacer{flex:1}
.user{display:flex;align-items:center;gap:9px;font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:#dbe6f7;display:grid;place-items:center;font-weight:700;color:var(--blue)}
.user small{display:block;color:var(--muted);font-size:11.5px}

.kpis{position:absolute;left:12px;top:80px;display:flex;gap:10px}
.kpi{padding:10px 14px;min-width:138px}
.kpi .k{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:21px;font-weight:700;margin-top:2px;letter-spacing:-.2px}
.kpi .v small{font-size:12px;font-weight:500;color:var(--muted);margin-left:3px}
.kpi .d{font-size:11.5px;font-weight:600}
.up{color:var(--green)} .down{color:var(--red)}

.zones{position:absolute;left:12px;top:170px;width:236px;padding:12px;max-height:calc(100vh - 170px - 222px);overflow:auto}
.sec-title{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.zone-item{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;cursor:pointer;font-size:13px}
.zone-item:hover{background:#f1f5fb}
.zone-item.active{background:var(--blue-soft);color:var(--blue)}
.zone-item .nm{flex:1;line-height:1.2}
.zone-item .nm small{display:block;color:var(--muted);font-size:11px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--green)}
.dot.warn{background:#f59e0b} .dot.alert{background:var(--red)} .dot.maint{background:#94a3b8}
.tools{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.tbtn{flex:1;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;gap:5px}
.tbtn:hover{background:#f3f6fa}
.tbtn.on{background:var(--blue-soft);border-color:#bfd3fb;color:var(--blue)}
.tools .tbtn{white-space:nowrap;padding:0 4px;min-width:0}
@media (max-width:1180px) and (min-width:1025px){.tools .tbtn{font-size:11px}}

.side{position:absolute;right:12px;top:80px;bottom:12px;width:350px;padding:16px;overflow:auto}
.zhead{display:flex;gap:12px;align-items:flex-start}
.zicon{width:44px;height:44px;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none}
.zhead h2{font-size:17px;margin:0;line-height:1.25}
.zhead p{margin:2px 0 0;color:var(--muted);font-size:12px}
.status{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;margin-top:6px}
.status.ok{background:var(--green-soft);color:var(--green)}
.status.warn{background:var(--amber-soft);color:var(--amber)}
.status.alert{background:var(--red-soft);color:var(--red)}
.status.maint{background:#eef1f5;color:#64748b}
.zdesc{font-size:12.5px;color:#41506a;margin:12px 0 4px;line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.metric{border:1px solid var(--line);border-radius:11px;padding:9px 11px;background:#fff}
.metric .k{font-size:11.5px;color:var(--muted)}
.metric .v{font-size:18px;font-weight:700;margin-top:1px}
.metric .v small{font-size:11.5px;color:var(--muted);font-weight:500;margin-left:2px}
.metric .bar{height:4px;border-radius:9px;background:#edf1f6;margin-top:6px;overflow:hidden}
.metric .bar i{display:block;height:100%;border-radius:9px;background:var(--blue);transition:width .6s}
.block{margin-top:16px}
.block h3{font-size:13px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.block h3 small{font-weight:500;color:var(--muted);font-size:11.5px;text-align:right}
.spark{border:1px solid var(--line);border-radius:11px;background:#fff;padding:8px 8px 4px}
.list .row{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid #eef2f6;font-size:12.5px}
.list .row:last-child{border-bottom:0}
.list .row .nm{flex:1;min-width:0}
.list .row .nm b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .row .nm small{color:var(--muted);font-size:11px}
.list .row .val{text-align:right;font-weight:600;font-size:12px;min-width:70px}
.mini{height:4px;width:70px;border-radius:9px;background:#edf1f6;margin-top:4px;margin-left:auto;overflow:hidden}
.mini i{display:block;height:100%;background:var(--green);border-radius:9px}
.batchcard{border:1px solid #cfe0fb;background:linear-gradient(180deg,#f5f9ff,#fff);border-radius:12px;padding:11px 12px;font-size:12.5px}
.batchcard b{font-size:13.5px}
.batchcard .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11.5px;margin-top:4px}
.prog{height:6px;border-radius:9px;background:#e6edf7;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#3b82f6);border-radius:9px;transition:width .6s}

.bottom{position:absolute;left:12px;right:374px;bottom:12px;height:200px;display:flex;gap:10px}
.track{flex:1.35;padding:14px 16px;min-width:0}
.tasks{flex:1;padding:14px 14px;min-width:0;overflow:hidden;display:flex;flex-direction:column}
.btabs{display:flex;gap:6px}
.btab{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 9px;font-size:11.5px;cursor:pointer}
.btab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.binfo{display:flex;align-items:baseline;gap:10px;margin:10px 0 2px;font-size:13px;flex-wrap:wrap}
.binfo b{font-size:14px}
.binfo span{color:var(--muted);font-size:12px}
.steps{display:flex;margin-top:14px;position:relative}
.step{flex:1;text-align:center;position:relative;cursor:pointer;font-size:11.5px}
.step:before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:3px;background:#e3e9f2;z-index:0}
.step:first-child:before{display:none}
.step.done:before,.step.cur:before{background:var(--blue)}
.step .c{width:28px;height:28px;border-radius:50%;margin:0 auto;background:#fff;border:2px solid #d6deea;display:grid;place-items:center;position:relative;z-index:1;color:#94a3b8;font-weight:700;font-size:12px}
.step.done .c{background:var(--blue);border-color:var(--blue);color:#fff}
.step.cur .c{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 5px rgba(37,99,235,.15)}
.step .t{margin-top:6px;font-weight:600;line-height:1.2}
.step .s{color:var(--muted);font-size:10.5px;margin-top:2px}
.step:hover .t{color:var(--blue)}
.task-list{overflow:auto;flex:1;margin-top:2px}
.task{display:flex;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid #eef2f6;cursor:pointer;font-size:12.5px;animation:fadein .4s}
.task:hover{background:#f6f9fd}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}}
.task .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:13px}
.task .nm{flex:1;min-width:0}
.task .nm b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task .nm small{color:var(--muted);font-size:11px}
.tag{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.tag.r{background:var(--red-soft);color:var(--red)} .tag.a{background:var(--amber-soft);color:var(--amber)} .tag.b{background:var(--blue-soft);color:var(--blue)} .tag.g{background:var(--green-soft);color:var(--green)}

.pin{pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;transition:opacity .25s}
.pin-card{display:flex;align-items:center;gap:7px;background:#fff;border-radius:10px;padding:5px 10px 5px 7px;box-shadow:0 4px 14px rgba(15,35,70,.16);font-size:12px;white-space:nowrap;border:1.5px solid transparent;transition:transform .2s,border-color .2s}
.pin-card .pi{width:22px;height:22px;border-radius:7px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}
.pin-card b{font-weight:600;display:block;line-height:1.15}
.pin-card small{display:block;color:var(--muted);font-size:10.5px;line-height:1.2}
.pin-stem{width:2px;height:18px;background:linear-gradient(#fff,rgba(255,255,255,.2))}
.pin:hover .pin-card{transform:translateY(-2px)}
.pin.active .pin-card{border-color:var(--blue);transform:scale(1.05)}
.pin.warn .pin-card .pi{background:var(--amber-soft);color:var(--amber)}
.pin.maint .pin-card .pi{background:#eef1f5;color:#64748b}
.pin.alert .pin-card .pi{background:var(--red-soft);color:var(--red)}
.hide-labels .pin{opacity:0;pointer-events:none}

.toast{position:absolute;left:50%;top:80px;transform:translate(-50%,-20px);opacity:0;padding:10px 14px;display:flex;gap:10px;align-items:center;font-size:13px;transition:.35s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.hint{position:absolute;left:calc(50% - 57px);bottom:222px;transform:translateX(-50%);font-size:11.5px;color:#56657c;background:rgba(255,255,255,.75);padding:4px 10px;border-radius:99px;pointer-events:none;white-space:nowrap}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:#e6eef6;z-index:9;color:var(--muted);font-size:14px;transition:opacity .5s}

.sheet{display:contents}
.sheet-head,.icon-btn{display:none}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;place-items:center;cursor:pointer;flex:none;color:var(--muted)}
@media (max-width:1380px){.kpi:nth-child(5){display:none}}
@media (max-width:1180px){.kpi:nth-child(4){display:none}.zones{width:214px}.user>div:last-child,.chip.shift{display:none}}

/* tablet portrait & mobile: bottom sheet layout */
@media (max-width:1024px){
  header{left:8px;right:8px;top:calc(8px + env(safe-area-inset-top));height:52px;padding:0 8px 0 10px;gap:8px}
  .brand{min-width:0;flex:1}
  .brand>div:last-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .search{display:none}
  header.searching .brand{display:none}
  header.searching .search{display:flex;flex:1;max-width:none}
  .icon-btn{display:grid}
  .chip.plant,.chip.shift,.user,.spacer{display:none}
  .kpis{left:0;right:0;top:calc(68px + env(safe-area-inset-top));padding:0 8px 6px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory}
  .kpis::-webkit-scrollbar{display:none}
  .kpi,.kpi:nth-child(4),.kpi:nth-child(5){display:block;min-width:132px;padding:8px 12px;scroll-snap-align:start;flex:none}
  .kpi .v{font-size:18px}
  .hint{display:none}
  .sheet{display:flex;flex-direction:column;position:absolute;left:0;right:0;bottom:0;height:var(--sheet-h,44dvh);background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(15,35,70,.14);transition:height .3s ease;padding-bottom:env(safe-area-inset-bottom);overflow:hidden}
  .sheet.collapsed{height:calc(92px + env(safe-area-inset-bottom))}
  .sheet-head{display:block;padding:2px 12px 10px;border-bottom:1px solid var(--line);flex:none}
  .grabwrap{padding:8px 0 10px;cursor:pointer;touch-action:none}
  .grab{width:44px;height:5px;border-radius:9px;background:#cbd5e1;margin:0 auto}
  .stabs{display:flex;gap:6px}
  .stab{flex:1;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer;white-space:nowrap;padding:0 6px}
  .stab.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .bottom{display:contents}
  .pane{display:none!important;position:static!important;width:auto!important;height:auto!important;max-height:none!important;flex:1;min-height:0;overflow:auto!important;background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;backdrop-filter:none!important;padding:14px 16px 18px!important}
  .pane.on{display:block!important}
  .tasks.pane.on{display:flex!important}
  .track .sec-title{flex-wrap:wrap}
  .zone-item{padding:10px 8px}
  .toast{top:calc(150px + env(safe-area-inset-top));max-width:calc(100% - 24px);width:max-content}
  .step{min-width:0}
  .pin-card{font-size:11px;padding:4px 8px 4px 5px;gap:5px}
  .pin-card .pi{width:18px;height:18px}
  .pin-card small{display:none}
  .pin.active .pin-card small{display:block}
  .pin-stem{height:12px}
}
@media (max-width:600px){
  .brand small,.live small{display:none}
  .brand b{font-size:14px}
  .kpi,.kpi:nth-child(4),.kpi:nth-child(5){min-width:108px;padding:6px 10px}
  .kpi .v{font-size:16px}
  .kpi .d span{display:none}
  .sheet{--sheet-h:45dvh}
  .stab{font-size:12px;padding:0 4px}
  .step .t{font-size:10.5px}
  .step .s{display:none}
  .pin:not(.active) .pin-card{padding:4px}
  .pin:not(.active) .pin-card>span:last-child{display:none}
}
/* phone landscape: sheet docks to the right */
@media (max-width:1024px) and (orientation:landscape) and (max-height:520px){
  .kpis{display:none}
  .sheet{left:auto;width:min(380px,50vw);height:calc(100dvh - 68px);border-radius:20px 0 0 0}
  .sheet.collapsed{height:92px}
  .toast{top:70px}
}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="scene"></div>
<div class="loading" id="loading">กำลังโหลดโรงงาน 3D…</div>

<div class="ui" id="ui">
  <header class="card">
    <div class="brand">
      <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 8.5A2 2 0 0 0 6.7 21h10.6a2 2 0 0 0 1.7-3.5L14 9V3"/><path d="M8 15c2-1.5 4 1.5 8 0"/></svg></div>
      <div><b>AgroChem Command</b><small>ศูนย์ควบคุมโรงงานเคมีเกษตร</small></div>
    </div>
    <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" placeholder="ค้นหาโซน แบตช์ หรือสินค้า เช่น R-02, ไกลโฟเซต แล้วกด Enter"></label>
    <button class="icon-btn" id="btnSearch" aria-label="ค้นหา"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <div class="spacer"></div>
    <div class="chip plant">🏭 <span>โรงงานบางปะกง</span><small>ฉะเชิงเทรา</small></div>
    <div class="chip live"><i></i>LIVE <small id="clock">--:--:--</small></div>
    <div class="chip shift"><small>กะ</small> B · 14:00–22:00</div>
    <div class="user"><div class="avatar">สว</div><div>สมชาย วงศ์ใหญ่<small>ผู้จัดการฝ่ายผลิต</small></div></div>
  </header>

  <div class="kpis" id="kpis"></div>

  <div class="sheet" id="sheet">
  <div class="sheet-head">
    <div class="grabwrap" id="grab"><div class="grab"></div></div>
    <div class="stabs"><button class="stab" data-pane="side">รายละเอียด</button><button class="stab" data-pane="batch">แบตช์</button><button class="stab" data-pane="tasks">แจ้งเตือน</button><button class="stab" data-pane="zones">โซน</button></div>
  </div>
  <div class="zones card pane" data-pane="zones">
    <div class="sec-title">โซนในโรงงาน <span id="zoneCount"></span></div>
    <div id="zoneList"></div>
    <div class="tools">
      <button class="tbtn" id="btnHome" title="กลับมุมมองรวม">⌂ ภาพรวม</button>
      <button class="tbtn on" id="btnRotate" title="หมุนกล้องอัตโนมัติ">⟳ หมุน</button>
      <button class="tbtn on" id="btnLabels" title="แสดงป้ายชื่อ">◉ ป้าย</button>
    </div>
  </div>

  <aside class="side card pane" data-pane="side" id="side"></aside>

  <div class="bottom">
    <section class="track card pane" data-pane="batch">
      <div class="sec-title" style="margin:0">ติดตามแบตช์การผลิต <div class="btabs" id="btabs"></div></div>
      <div class="binfo" id="binfo"></div>
      <div class="steps" id="steps"></div>
    </section>
    <section class="tasks card pane" data-pane="tasks">
      <div class="sec-title">งานและการแจ้งเตือน <span id="taskCount" class="tag b"></span></div>
      <div class="task-list" id="tasks"></div>
    </section>
  </div>
  </div>
  <div class="hint">ลากเพื่อหมุน · คลิกขวาลากเพื่อเลื่อน · ลูกกลิ้งเพื่อซูม · คลิกอาคารเพื่อดูรายละเอียด</div>
  <div class="toast card" id="toast"></div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// the part of the screen not covered by panels; the 3D scene is centred there
function freeRect(){
  const W=innerWidth, H=innerHeight, q=s=>document.querySelector(s);
  if(isSheet()){
    const s=q('#sheet').getBoundingClientRect(), k=q('#kpis');
    const top=(getComputedStyle(k).display!=='none'?k.getBoundingClientRect().bottom:q('header').getBoundingClientRect().bottom)+6;
    if(s.left>10) return {l:0,r:s.left,t:top,b:H};
    return {l:0,r:W,t:top,b:Math.max(top+80,s.top)};
  }
  return {l:W>900?260:0, r:W-374, t:170, b:H-224};
}
function frameView(){
  const W=innerWidth, H=innerHeight, f=freeRect();
  camera.aspect=W/H;
  camera.setViewOffset(W,H,W/2-(f.l+f.r)/2,H/2-(f.t+f.b)/2,W,H);
}
let homeD=235;
// camera distance that fits the whole plant inside the free area
function homePose(){
  const f=freeRect(), H=innerHeight;
  const fracH=Math.max(.2,(f.b-f.t)/H), asp=(f.r-f.l)/Math.max(1,f.b-f.t);
  const tan=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const phone=innerWidth<=600;
  homeD=THREE.MathUtils.clamp(Math.max((phone?50:isSheet()?62:75)/(tan*fracH*asp),(phone?34:39.6)/(tan*fracH)),180,700);
  scene.fog.near=homeD*.85; scene.fog.far=homeD*1.75; controls.maxDistance=Math.max(300,homeD*1.4);
  return {target:HOME_T.clone(), pos:HOME_T.clone().add(HOME_DIR.clone().multiplyScalar(homeD))};
}

controls.maxPolarAngle = 1.22; controls.minDistance = 35; controls.maxDistance = 300;
frameView(); { const h=homePose(); camera.position.copy(h.pos); controls.target.copy(h.target); }

function mesh(geo,mat,parent,x=0,y=0,z=0){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;}
function box(w,h,d,c,parent,x=0,y=0,z=0,o){return mesh(new THREE.BoxGeometry(w,h,d),typeof c==='string'?M(c,o):c,parent,x,y+h/2,z);}

const movers=[];
function follower(obj,pts,speed,offset=0,pingpong=false){
  const segs=[]; let total=0;
  const P=pts.map(p=>new THREE.Vector3(p[0],0,p[1]));
  const n=pingpong?P.length-1:P.length;
  for(let i=0;i<n;i++){ const a=P[i], b=P[(i+1)%P.length]; const l=a.distanceTo(b); segs.push({a,b,l,s:total}); total+=l; }
  movers.push({obj,segs,total,speed,d:offset*total,pingpong,dir:1});
  scene.add(obj);
}
function updateMovers(dt){
  for(const m of movers){
    if(m.pingpong){ m.d+=m.speed*dt*m.dir; if(m.d>m.total){m.d=m.total;m.dir=-1;} if(m.d<0){m.d=0;m.dir=1;} }
    else m.d=(m.d+m.speed*dt)%m.total;
    const seg=m.segs.find(s=>m.d>=s.s && m.d<=s.s+s.l)||m.segs[0];
    const t=(m.d-seg.s)/seg.l;
    m.obj.position.lerpVectors(seg.a,seg.b,t); m.obj.position.y=.4;
    const dx=(seg.b.x-seg.a.x)*m.dir, dz=(seg.b.z-seg.a.z)*m.dir;
    const target=Math.atan2(-dz,dx);
    let diff=target-m.obj.rotation.y; diff=Math.atan2(Math.sin(diff),Math.cos(diff));
    m.obj.rotation.y+=diff*Math.min(1,dt*8);
  }
}

function sparkSVG(arr){
  const W=300,H=74,p=6, mn=Math.min(...arr), mx=Math.max(...arr), r=(mx-mn)||1;
  const pts=arr.map((v,i)=>[p+i*(W-2*p)/(arr.length-1), H-p-((v-mn)/r)*(H-2*p-8)]);
  const line=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2563eb" stop-opacity=".25"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+line+' L'+last[0]+' '+H+' L'+p+' '+H+' Z" fill="url(#g)"/><path d="'+line+'" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'+
    '<circle cx="'+last[0]+'" cy="'+last[1]+'" r="4" fill="#fff" stroke="#2563eb" stroke-width="2.2"/></svg>';
}

  $('#btabs').innerHTML=batches.map((x,i)=>'<button class="btab'+(i===curBatch?' on':'')+'" data-i="'+i+'">'+x.id+'</button>').join('');
  document.querySelectorAll('.btab').forEach(el=>el.onclick=()=>{curBatch=+el.dataset.i; renderBatch(); select(STEPS[batches[curBatch].step][1],true,false);});
  $('#binfo').innerHTML='<b>'+b.prod+'</b><span>'+b.size+' · '+b.cust+'</span><span style="margin-left:auto;color:var(--blue);font-weight:600">'+STEPS[b.step][0]+' '+Math.round(b.pct)+'%</span>';
  $('#steps').innerHTML=STEPS.map((s,i)=>{const cls=i<b.step?'done':i===b.step?'cur':'';
    return '<div class="step '+cls+'" data-z="'+s[1]+'"><div class="c">'+(i<b.step?'✓':i+1)+'</div><div class="t">'+s[0]+'</div><div class="s">'+(i===b.step?'กำลังดำเนินการ':b.times[i])+'</div></div>';}).join('');
  document.querySelectorAll('.step').forEach(el=>el.onclick=()=>select(el.dataset.z,true,false));
}
function renderTasks(){
  const col={r:'#fdecec',a:'#fff4e0',b:'#e8f0ff',g:'#e7f7ec'};
  $('#tasks').innerHTML=tasks.slice(0,12).map(t=>'<div class="task" data-z="'+t.zone+'"><div class="ic" style="background:'+col[t.t]+'">'+t.ic+'</div><div class="nm"><b>'+t.title+'</b><small>'+zones[t.zone].name+' · '+t.time+'</small></div><span class="tag '+t.t+'">'+t.tag+'</span></div>').join('');
  $('#taskCount').textContent=tasks.slice(0,12).filter(t=>t.t!=='g').length+' รายการเปิดอยู่';
  document.querySelectorAll('.task').forEach(el=>el.onclick=()=>select(el.dataset.z,true));
}

let anim=null;
function flyTo(target,pos,dur=1.1){ anim={t:0,dur,f0:controls.target.clone(),f1:target,p0:camera.position.clone(),p1:pos}; }
function select(id,fly,detail=true){
  current=id; renderSide(); renderZones(); renderPins();
  if(detail && isSheet()) setPane('side');
  const z=zones[id]; ring.userData.r=RING_R[id];
  ring.position.x=ringFill.position.x=z.pos[0]; ring.position.z=ringFill.position.z=z.pos[1];
  if(fly){
    const t=new THREE.Vector3(z.pos[0],2,z.pos[1]);
    const dir=camera.position.clone().sub(controls.target).normalize();
    dir.y=Math.max(dir.y,.55); dir.normalize();
    flyTo(t,t.clone().add(dir.multiplyScalar(homeD*.56)));
    setRotate(false);
  }
}
function setRotate(on){ controls.autoRotate=on; $('#btnRotate').classList.toggle('on',on); }
$('#btnHome').onclick=()=>{ const h=homePose(); flyTo(h.target,h.pos,1.3); };
$('#btnRotate').onclick=()=>setRotate(!controls.autoRotate);
$('#btnLabels').onclick=e=>{ document.body.classList.toggle('hide-labels'); e.currentTarget.classList.toggle('on'); };
controls.addEventListener('start',()=>{anim=null;});

$('#search').addEventListener('keydown',e=>{
  if(e.key!=='Enter') return; const q=e.target.value.trim().toLowerCase(); if(!q) return;
  const bh=batches.findIndex(b=>(b.id+b.prod).toLowerCase().includes(q));
  const hit=zoneIds.find(id=>{const z=zones[id]; return (z.name+z.en+z.desc+z.metrics.map(m=>m.k).join(' ')+z.list.map(r=>r.n+r.s).join(' ')).toLowerCase().includes(q);});
  if(hit) select(hit,true);
  else if(bh>=0){curBatch=bh; renderBatch(); select(STEPS[batches[bh].step][1],true);}
  else toast('🔍','ไม่พบ "'+e.target.value+'"');
  if(isSheet()) e.target.blur();
});
$('#btnSearch').onclick=()=>{ const h=$('header'); h.classList.toggle('searching'); if(h.classList.contains('searching')) $('#search').focus(); };
$('#search').addEventListener('blur',()=>setTimeout(()=>$('header').classList.remove('searching'),150));

// bottom sheet (tablet/mobile)
const sheetEl=$('#sheet'); let grabY=null;
document.querySelectorAll('.stab').forEach(b=>b.onclick=()=>setPane(b.dataset.pane));
$('#grab').addEventListener('click',()=>sheetEl.classList.toggle('collapsed'));
$('#grab').addEventListener('touchstart',e=>{grabY=e.touches[0].clientY;},{passive:true});
$('#grab').addEventListener('touchend',e=>{ if(grabY==null) return; const dy=e.changedTouches[0].clientY-grabY; if(dy>30) sheetEl.classList.add('collapsed'); else if(dy<-30) sheetEl.classList.remove('collapsed'); grabY=null; });

const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(); let downAt=null, hoverZone=null;
function pick(e){ mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(mouse,camera); const h=ray.intersectObjects(pickables,false)[0]; return h?h.object.userData.zone:null; }
renderer.domElement.addEventListener('pointerdown',e=>downAt=[e.clientX,e.clientY]);
renderer.domElement.addEventListener('pointerup',e=>{ if(!downAt) return; if(Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])<5){ const z=pick(e); if(z) select(z,true);} downAt=null; });
renderer.domElement.addEventListener('pointermove',e=>{ if(e.buttons) return; const z=pick(e); if(z!==hoverZone){ hoverZone=z; renderer.domElement.style.cursor=z?'pointer':''; } });

let toastT;
function toast(ic,msg,zone){ const el=$('#toast'); el.innerHTML='<span style="font-size:18px">'+ic+'</span><span>'+msg+'</span>'+(zone?'<button class="tbtn" style="flex:none;padding:0 10px">ดูโซน</button>':''); el.classList.add('show');
  if(zone) el.querySelector('button').onclick=()=>{select(zone,true); el.classList.remove('show');};
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),5000); }

const nowStr=()=>new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
function tick(){
  for(const id of zoneIds) for(const m of zones[id].metrics){ if(m.j) m.v=Math.max(0,m.v+rnd(-m.j,m.j)); if(m.inc) m.v+=Math.round(rnd(0,m.inc*2)); }
  kpis[0].v+=Math.round(rnd(2,9)); kpis[1].v=Math.min(99,Math.max(70,kpis[1].v+rnd(-.1,.1))); kpis[3].v+=rnd(.001,.004);
  for(const b of batches){
    if(b.step<5){ b.pct+=rnd(.3,1.2); if(b.pct>=100){ b.times[b.step]=nowStr(); b.step++; b.pct=3; toast('✅',b.id+' เข้าสู่ขั้นตอน "'+STEPS[b.step][0]+'"',STEPS[b.step][1]); if(current) renderSide(); } }
    else b.pct=Math.min(100,b.pct+rnd(.2,.6));
  }
  if(current){ $('#mgrid').innerHTML=zones[current].metrics.map(metricHTML).join('');
    const bi=batchForZone(current); if(bi>=0 && $('#bpct')){ $('#bpct').textContent=Math.round(batches[bi].pct)+'%'; $('#bbar').style.width=batches[bi].pct+'%'; } }
  renderPins(); renderZones(); renderKPIs(); renderBatch();
}
function sparkTick(){
  for(const id of zoneIds){ const s=zones[id].spark; const last=s[s.length-1]; const span=(Math.max(...s)-Math.min(...s))||1; s.push(+(last+rnd(-span*.15,span*.15)).toFixed(2)); s.shift(); }
  if(current) $('#spark').innerHTML=sparkSVG(zones[current].spark);
}

const events=[
  ()=>{zones.reactor.status='warn'; zones.reactor.metrics[0].v=46.8; tasks.unshift({t:'r',ic:'🌡️',title:'R-02 อุณหภูมิสูงกว่าเกณฑ์ (46.8°C > 45°C)',zone:'reactor',time:nowStr(),tag:'ด่วน'}); toast('🌡️','R-02 อุณหภูมิสูงกว่าเกณฑ์ ระบบเปิดน้ำหล่อเย็นอัตโนมัติ','reactor');
       setTimeout(()=>{zones.reactor.status='ok'; zones.reactor.metrics[0].v=43.1; tasks.unshift({t:'g',ic:'✅',title:'R-02 อุณหภูมิกลับสู่ระดับปกติ',zone:'reactor',time:nowStr(),tag:'แก้ไขแล้ว'}); renderTasks(); renderZones(); renderPins(); if(current==='reactor') renderSide(); },14000);},
  ()=>{zones.dock.metrics[0].v++; tasks.unshift({t:'g',ic:'🚚',title:'รถ 70-4821 ขึ้นสินค้าครบ ออกเดินทางไปนครสวรรค์',zone:'dock',time:nowStr(),tag:'เสร็จ'}); toast('🚚','รถ 70-4821 ออกจากโรงงานแล้ว','dock');},
  ()=>{zones.qc.metrics[0].v++; tasks.unshift({t:'b',ic:'🧪',title:'ได้รับตัวอย่างใหม่จากไลน์บรรจุ L2',zone:'qc',time:nowStr(),tag:'รอตรวจ'}); toast('🧪','ห้อง QC ได้รับตัวอย่างใหม่ 1 รายการ','qc');},
  ()=>{zones.tankfarm.status='warn'; zones.tankfarm.list[3].v='9.8 kL'; zones.tankfarm.list[3].p=19; tasks.unshift({t:'a',ic:'🛢️',title:'T-04 ปุ๋ยน้ำ Base ต่ำกว่า 20% ควรเติม',zone:'tankfarm',time:nowStr(),tag:'เติมถัง'}); toast('🛢️','ถัง T-04 ระดับต่ำกว่า 20%','tankfarm');
       setTimeout(()=>{zones.tankfarm.status='ok'; zones.tankfarm.list[3].v='31.0 kL'; zones.tankfarm.list[3].p=62; renderZones(); renderPins(); if(current==='tankfarm') renderSide();},16000);},
];
let evI=0;
function fireEvent(){ events[evI++%events.length](); renderTasks(); renderZones(); renderPins(); if(current) renderSide(); }

const clock=new THREE.Clock();
function animate(){
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  frameView();
  if(anim){ anim.t+=dt/anim.dur; const e=anim.t>=1?1:1-Math.pow(1-anim.t,3);
    controls.target.lerpVectors(anim.f0,anim.f1,e); camera.position.lerpVectors(anim.p0,anim.p1,e); if(anim.t>=1) anim=null; }
  controls.update();
  updateMovers(dt);
  agitators.forEach((a,i)=>a.rotation.y+=dt*(3+i));
  clarArm.rotation.y+=dt*.3;
  for(const c of cartons){ c.userData.u=(c.userData.u+dt*.06)%1; c.position.x=11+c.userData.u*19; }
  for(const s of smoke){ s.userData.t=(s.userData.t+dt*.08)%1; const k=s.userData.t;
    s.position.set(smokeSrc.x+k*6+Math.sin(k*9+t)*.4,smokeSrc.y+k*14,smokeSrc.z-k*2); s.scale.setScalar(.6+k*2.6); s.material.opacity=.55*(1-k); }
  const r=ring.userData.r||0, pulse=1+Math.sin(t*3)*.03;
  ring.scale.setScalar(r*pulse); ringFill.scale.setScalar(r*pulse);
  for(const id of zoneIds) pins[id].o.position.y=pins[id].base+(id===current?Math.sin(t*3)*.4:0);
  renderer.render(scene,camera); labelRenderer.render(scene,camera);
  requestAnimationFrame(animate);
}

let lastW=innerWidth, resizeT;
addEventListener('resize',()=>{ frameView(); renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight);
  clearTimeout(resizeT); resizeT=setTimeout(()=>{ if(Math.abs(innerWidth-lastW)>40){ lastW=innerWidth; const h=homePose(); flyTo(h.target,h.pos,.8); } },250); });
setInterval(()=>{$('#clock').textContent=new Date().toLocaleTimeString('th-TH');},1000);

renderKPIs(); renderBatch(); renderTasks(); select('reactor',false); setRotate(true);
setInterval(tick,2000); setInterval(sparkTick,6000); setTimeout(()=>{fireEvent(); setInterval(fireEvent,18000);},7000);
animate();
const ld=$('#loading'); ld.style.opacity=0; setTimeout(()=>ld.remove(),600);
</script>
</body>
</html>
